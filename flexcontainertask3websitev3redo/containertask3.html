<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <title>Task 3 - Semantic Layout Challenge</title> 

    <link rel="stylesheet" href="style.css"> 

</head> 

<body> 

  

    <div class="page-container"> 

  

        <header> 
            <div class="logo">Logo Image</div>
            <p class="makebig">Heading 1</p> 

        </header> 

  

        <nav> 
            <p class="cent makebig">unordered list with list items of - Home, About Us and Contact Us</p> 

        </nav> 

  

        <main class="main-content"> 
            <div class="content-box">

            </div>

                <p class="makebig">image</p>
            </div>

        </main> 

  

        <footer> 
            <p class="cent makebig">Unordered list of footer info</p>
            <div class="social-links">
                <p class="makemed">Social media links</p>
            </div>
        </footer> 

  

    </div>
